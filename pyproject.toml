[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-forge"
version = "0.1.0"
description = "Controlled persona generation with cross-session behavioural consistency validation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
openai    = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
gemini    = ["google-genai>=1.0"]
all       = ["openai>=1.0", "anthropic>=0.25", "google-genai>=1.0"]
dev       = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
persona-forge = "persona_forge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["persona_forge*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
